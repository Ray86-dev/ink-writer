name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and project checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm run test:ts
      - run: npm run fixtures
      - name: Licences (rule 8)
        run: npm run licenses

  app:
    name: App on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install WebKitGTK and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run check:rust
      - run: npm run test:rust
      - name: Build the app with its page embedded, start it and run the smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Build the app with its page embedded, start it and run the smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - name: Kill the app while it writes, and check nothing was lost
        if: runner.os != 'Linux'
        run: node scripts/crash-test.mjs
      - name: Kill the app while it writes, and check nothing was lost
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/crash-test.mjs
      - name: Open a second copy of the app
        if: runner.os != 'Linux'
        run: node scripts/instance-test.mjs
      - name: Open a second copy of the app
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/instance-test.mjs
      - name: Measure typing with 150,000 words
        if: runner.os != 'Linux'
        run: node scripts/perf-test.mjs
      - name: Measure typing with 150,000 words
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/perf-test.mjs
